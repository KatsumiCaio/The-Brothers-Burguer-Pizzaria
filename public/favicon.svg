<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Terracotta Brick Background Pattern -->
    <pattern id="brick-pattern" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#CB7154"/>
      <!-- Mortar lines -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="#E5B29F" stroke-width="2"/>
      <line x1="0" y1="20" x2="80" y2="20" stroke="#E5B29F" stroke-width="2"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#E5B29F" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="40" stroke="#E5B29F" stroke-width="2"/>
      <line x1="80" y1="20" x2="80" y2="40" stroke="#E5B29F" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="url(#brick-pattern)"/>

  <!-- Outer Black Gear / Sawtooth Seal Badge -->
  <g transform="translate(250, 190)" filter="url(#shadow)">
    <!-- Gear Teeth Outer Ring -->
    <circle r="105" fill="#111111" />
    <g fill="#111111">
      <circle cx="0" cy="-105" r="10"/>
      <circle cx="27" cy="-101" r="10"/>
      <circle cx="53" cy="-91" r="10"/>
      <circle cx="74" cy="-74" r="10"/>
      <circle cx="91" cy="-53" r="10"/>
      <circle cx="101" cy="-27" r="10"/>
      <circle cx="105" cy="0" r="10"/>
      <circle cx="101" cy="27" r="10"/>
      <circle cx="91" cy="53" r="10"/>
      <circle cx="74" cy="74" r="10"/>
      <circle cx="53" cy="91" r="10"/>
      <circle cx="27" cy="101" r="10"/>
      <circle cx="0" cy="105" r="10"/>
      <circle cx="-27" cy="101" r="10"/>
      <circle cx="-53" cy="91" r="10"/>
      <circle cx="-74" cy="74" r="10"/>
      <circle cx="-91" cy="53" r="10"/>
      <circle cx="-101" cy="27" r="10"/>
      <circle cx="-105" cy="0" r="10"/>
      <circle cx="-101" cy="-27" r="10"/>
      <circle cx="-91" cy="-53" r="10"/>
      <circle cx="-74" cy="-74" r="10"/>
      <circle cx="-53" cy="-91" r="10"/>
      <circle cx="-27" cy="-101" r="10"/>
    </g>
    
    <!-- Inner Circle Background (Matching Wall) -->
    <circle r="88" fill="#D27B5E" stroke="#111111" stroke-width="4"/>
    <circle r="78" fill="none" stroke="#111111" stroke-width="2"/>

    <!-- Central Icons: Beer Mug & Cheeseburger -->
    <!-- Beer Mug -->
    <g transform="translate(-42, -35) scale(0.9)">
      <!-- Mug Glass -->
      <rect x="0" y="10" width="42" height="55" rx="5" fill="#F4F4F4" fill-opacity="0.3" stroke="#111111" stroke-width="3"/>
      <!-- Golden Beer -->
      <rect x="3" y="24" width="36" height="38" rx="3" fill="#FBBF24"/>
      <!-- Beer Head / Foam -->
      <path d="M -2 24 Q 5 10 12 24 Q 20 8 30 24 Q 40 10 44 24 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
      <!-- Handle -->
      <path d="M 42 20 C 58 20, 58 50, 42 52" fill="none" stroke="#111111" stroke-width="4"/>
      <path d="M 42 25 C 52 25, 52 45, 42 47" fill="none" stroke="#111111" stroke-width="2"/>
    </g>

    <!-- Gourmet Double Cheeseburger -->
    <g transform="translate(2, -35) scale(0.9)">
      <!-- Top Bun (Golden Brioche) -->
      <path d="M 0 30 C 0 8, 60 8, 60 30 Z" fill="#D97706" stroke="#111111" stroke-width="3"/>
      <!-- Sesame seeds -->
      <circle cx="20" cy="18" r="1.5" fill="#FEF3C7"/>
      <circle cx="35" cy="15" r="1.5" fill="#FEF3C7"/>
      <circle cx="45" cy="22" r="1.5" fill="#FEF3C7"/>
      <circle cx="28" cy="24" r="1.5" fill="#FEF3C7"/>
      <!-- Patty 1 -->
      <rect x="2" y="30" width="56" height="7" rx="3.5" fill="#451A03" stroke="#111111" stroke-width="2"/>
      <!-- Melted Cheddar Cheese -->
      <path d="M 0 36 L 60 36 L 52 44 L 40 38 L 25 46 L 15 38 L 5 44 Z" fill="#F59E0B" stroke="#111111" stroke-width="1.5"/>
      <!-- Patty 2 -->
      <rect x="2" y="40" width="56" height="7" rx="3.5" fill="#451A03" stroke="#111111" stroke-width="2"/>
      <!-- Bottom Bun -->
      <rect x="4" y="47" width="52" height="10" rx="4" fill="#D97706" stroke="#111111" stroke-width="3"/>
    </g>
  </g>

  <!-- Typography Section -->
  <g transform="translate(250, 360)" text-anchor="middle">
    <!-- Horizontal Top Bar with Script 'The' -->
    <line x1="-190" y1="-32" x2="-45" y2="-32" stroke="#111111" stroke-width="6" stroke-linecap="square"/>
    <text x="0" y="-22" font-family="'Brush Script MT', 'Playfair Display', cursive, serif" font-size="36" font-style="italic" font-weight="bold" fill="#111111">The</text>
    <line x1="45" y1="-32" x2="190" y2="-32" stroke="#111111" stroke-width="6" stroke-linecap="square"/>

    <!-- 'BROTHERS' Bold Headline -->
    <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="4" fill="#111111">BROTHERS</text>

    <!-- '2019' with flanking horizontal bars -->
    <line x1="-190" y1="56" x2="-55" y2="56" stroke="#111111" stroke-width="6" stroke-linecap="square"/>
    <text x="0" y="66" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#111111">2019</text>
    <line x1="55" y1="56" x2="190" y2="56" stroke="#111111" stroke-width="6" stroke-linecap="square"/>

    <!-- Bottom Slogan -->
    <text x="0" y="110" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="2.5" fill="#111111" opacity="0.85">NENHUM CONSEGUE NOSSO ESPAÇO</text>
  </g>
</svg>
