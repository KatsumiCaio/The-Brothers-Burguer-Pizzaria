<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Terracotta Brick Wall Pattern -->
    <pattern id="brick-wall" width="120" height="60" patternUnits="userSpaceOnUse">
      <!-- Brick base color -->
      <rect width="120" height="60" fill="#CB7255"/>
      <!-- Individual brick shading variations -->
      <rect x="2" y="2" width="56" height="26" fill="#C2684B" rx="1"/>
      <rect x="62" y="2" width="56" height="26" fill="#D3795C" rx="1"/>
      <rect x="2" y="32" width="26" height="26" fill="#D3795C" rx="1"/>
      <rect x="32" y="32" width="56" height="26" fill="#BE6447" rx="1"/>
      <rect x="92" y="32" width="26" height="26" fill="#C76D50" rx="1"/>
      <!-- Mortar lines -->
      <line x1="0" y1="0" x2="120" y2="0" stroke="#E6B4A2" stroke-width="3" opacity="0.85"/>
      <line x1="0" y1="30" x2="120" y2="30" stroke="#E6B4A2" stroke-width="3" opacity="0.85"/>
      <line x1="60" y1="0" x2="60" y2="30" stroke="#E6B4A2" stroke-width="3" opacity="0.85"/>
      <line x1="30" y1="30" x2="30" y2="60" stroke="#E6B4A2" stroke-width="3" opacity="0.85"/>
      <line x1="90" y1="30" x2="90" y2="60" stroke="#E6B4A2" stroke-width="3" opacity="0.85"/>
    </pattern>

    <!-- Drop Shadow Filter for Gear Seal -->
    <filter id="gear-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Beer Gradient -->
    <linearGradient id="beer-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Burger Bun Gradient -->
    <linearGradient id="bun-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Burger Patty Gradient -->
    <linearGradient id="patty-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#2D1102"/>
      <stop offset="100%" stop-color="#1A0A01"/>
    </linearGradient>

    <!-- Melted Cheese Gradient -->
    <linearGradient id="cheese-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Background Wall Canvas -->
  <rect width="600" height="600" fill="url(#brick-wall)"/>

  <!-- ==================== CENTER BLACK GEAR SEAL ==================== -->
  <g transform="translate(300, 220)" filter="url(#gear-shadow)">
    <!-- 22 Gear Notches Outer Perimeter -->
    <g fill="#0B0908">
      <circle r="120" />
      <!-- Teeth -->
      <circle cx="0" cy="-120" r="14"/>
      <circle cx="34" cy="-115" r="14"/>
      <circle cx="65" cy="-101" r="14"/>
      <circle cx="91" cy="-78" r="14"/>
      <circle cx="109" cy="-50" r="14"/>
      <circle cx="118" cy="-19" r="14"/>
      <circle cx="118" cy="19" r="14"/>
      <circle cx="109" cy="50" r="14"/>
      <circle cx="91" cy="78" r="14"/>
      <circle cx="65" cy="101" r="14"/>
      <circle cx="34" cy="115" r="14"/>
      <circle cx="0" cy="120" r="14"/>
      <circle cx="-34" cy="115" r="14"/>
      <circle cx="-65" cy="101" r="14"/>
      <circle cx="-91" cy="78" r="14"/>
      <circle cx="-109" cy="50" r="14"/>
      <circle cx="-118" cy="19" r="14"/>
      <circle cx="-118" cy="-19" r="14"/>
      <circle cx="-109" cy="-50" r="14"/>
      <circle cx="-91" cy="-78" r="14"/>
      <circle cx="-65" cy="-101" r="14"/>
      <circle cx="-34" cy="-115" r="14"/>
    </g>

    <!-- Inner Circle with Brick Background -->
    <circle r="102" fill="url(#brick-wall)" stroke="#0B0908" stroke-width="4.5"/>
    <circle r="92" fill="none" stroke="#0B0908" stroke-width="2.5" opacity="0.85"/>

    <!-- ==================== REALISTIC BEER MUG & BURGER ==================== -->
    <g transform="translate(0, -5)">
      
      <!-- BEER MUG (Left) -->
      <g transform="translate(-48, -40)">
        <!-- Mug Glass Shadow -->
        <rect x="4" y="16" width="46" height="66" rx="6" fill="#000000" opacity="0.3"/>
        
        <!-- Mug Body Glass -->
        <rect x="0" y="14" width="46" height="66" rx="6" fill="#FFFFFF" fill-opacity="0.3" stroke="#0B0908" stroke-width="3.5"/>
        
        <!-- Amber Liquid Inside -->
        <rect x="4" y="28" width="38" height="48" rx="4" fill="url(#beer-gradient)"/>
        
        <!-- Beer Highlights & Ribs -->
        <line x1="12" y1="30" x2="12" y2="72" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="23" y1="30" x2="23" y2="72" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        <line x1="34" y1="30" x2="34" y2="72" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

        <!-- Glass Handle (Left) -->
        <path d="M 0 24 C -20 24, -20 62, 0 64" fill="none" stroke="#0B0908" stroke-width="6" stroke-linecap="round"/>
        <path d="M 0 24 C -20 24, -20 62, 0 64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

        <!-- Creamy Beer Foam Head (Overflowing) -->
        <path d="M -3 28 
                 C -3 14, 10 10, 16 22 
                 C 22 8, 36 10, 42 22 
                 C 48 16, 52 24, 49 30 
                 C 44 32, 2 32, -3 28 Z" 
              fill="#FFFFFF" stroke="#0B0908" stroke-width="3"/>
        <!-- Foam Texture Dots -->
        <circle cx="16" cy="18" r="2" fill="#F3F4F6"/>
        <circle cx="28" cy="16" r="2.5" fill="#F3F4F6"/>
        <circle cx="38" cy="22" r="1.5" fill="#F3F4F6"/>
        <!-- Overflowing Foam Droplet on Glass -->
        <path d="M 12 28 Q 12 40 15 40 Q 18 40 18 28 Z" fill="#FFFFFF" stroke="#0B0908" stroke-width="1.5"/>
      </g>

      <!-- GOURMET DOUBLE CHEESEBURGER (Right) -->
      <g transform="translate(6, -38)">
        <!-- Burger Shadow -->
        <ellipse cx="38" cy="74" rx="36" ry="8" fill="#000000" opacity="0.35"/>

        <!-- Top Brioche Bun (Golden Curved) -->
        <path d="M 2 34 C 2 4, 74 4, 74 34 Z" fill="url(#bun-gradient)" stroke="#0B0908" stroke-width="3.5"/>
        <!-- Bun Highlight -->
        <path d="M 14 20 C 22 10, 54 10, 62 20" fill="none" stroke="#FEF3C7" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
        
        <!-- White Sesame Seeds -->
        <ellipse cx="22" cy="18" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(-15, 22, 18)"/>
        <ellipse cx="36" cy="14" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(10, 36, 14)"/>
        <ellipse cx="48" cy="16" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(-5, 48, 16)"/>
        <ellipse cx="58" cy="24" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(25, 58, 24)"/>
        <ellipse cx="28" cy="26" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(5, 28, 26)"/>
        <ellipse cx="44" cy="24" rx="2.5" ry="1.2" fill="#FFFBEB" transform="rotate(-20, 44, 24)"/>

        <!-- Upper Beef Patty (Thick & Grilled) -->
        <rect x="4" y="34" width="68" height="9" rx="4.5" fill="url(#patty-gradient)" stroke="#0B0908" stroke-width="2.5"/>

        <!-- Melted Cheddar Cheese Layer (Dripping over patties) -->
        <path d="M 2 42 
                 L 74 42 
                 L 66 52 
                 L 54 44 
                 L 46 54 
                 L 38 45 
                 L 26 53 
                 L 18 44 
                 L 8 52 Z" 
              fill="url(#cheese-gradient)" stroke="#0B0908" stroke-width="2"/>

        <!-- Lower Beef Patty -->
        <rect x="4" y="48" width="68" height="9" rx="4.5" fill="url(#patty-gradient)" stroke="#0B0908" stroke-width="2.5"/>

        <!-- Bottom Brioche Bun -->
        <rect x="6" y="56" width="64" height="14" rx="7" fill="url(#bun-gradient)" stroke="#0B0908" stroke-width="3.5"/>
      </g>

    </g>
  </g>

  <!-- ==================== TYPOGRAPHY SECTION ==================== -->
  <g transform="translate(300, 430)" text-anchor="middle">
    
    <!-- Top Divider Line with Cursive "The" in the center -->
    <line x1="-240" y1="-32" x2="-55" y2="-32" stroke="#0B0908" stroke-width="8" stroke-linecap="square"/>
    <text x="0" y="-18" font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, serif" font-size="46" font-style="italic" font-weight="bold" fill="#0B0908">The</text>
    <line x1="55" y1="-32" x2="240" y2="-32" stroke="#0B0908" stroke-width="8" stroke-linecap="square"/>

    <!-- Bold Main Typography "BROTHERS" -->
    <text x="0" y="44" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="#0B0908">BROTHERS</text>

    <!-- Bottom Divider Line with "2019" in the center -->
    <line x1="-240" y1="84" x2="-68" y2="84" stroke="#0B0908" stroke-width="8" stroke-linecap="square"/>
    <text x="0" y="98" font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#0B0908">2019</text>
    <line x1="68" y1="84" x2="240" y2="84" stroke="#0B0908" stroke-width="8" stroke-linecap="square"/>

    <!-- Bottom Official Slogan -->
    <text x="0" y="146" font-family="'Arial Black', 'Impact', sans-serif" font-size="16" font-weight="900" letter-spacing="3" fill="#0B0908">NENHUM CONSEGUE NOSSO ESPAÇO</text>
  </g>
</svg>
